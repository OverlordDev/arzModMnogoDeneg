name: ArzMarket snapshots

# Дампы цен каждые 30 минут: качаем свежие агрегаты ArzMarket,
# обновляем data/market_*.json + data/history/* и пушим обратно.
# Render подхватывает пуш и передеплоит сайт сам.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run snapshots
        run: python arz-terminal/scripts/snapshot.py --server yuma vc --window 14

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arz-terminal/data/
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
          else
            git commit -m "data: scheduled ArzMarket snapshot $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
